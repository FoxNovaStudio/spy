<title>Spyfall</title>

<style>
html,body{margin:0}
body{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
/* Layout: yksi kapea sarake, jokainen näkymä on kansiolehti (dossier) jonka päällä vaihtuva leima. */
:root{
  --bg:#e8edf2; --card:#f8fafc; --ink:#14202e; --muted:#586677; --line:#c3cfda;
  --accent:#c4372c; --accent-ink:#ffffff; --ok:#2b7a57; --field:#ffffff; --chip:#dde5ed;
  --display:'Special Elite','Courier New',monospace;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101822; --card:#182331; --ink:#e7eef6; --muted:#9aaabb; --line:#2c3b4d;
    --accent:#f0705f; --accent-ink:#1a0d0b; --ok:#5ec59a; --field:#0e1620; --chip:#223144;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101822; --card:#182331; --ink:#e7eef6; --muted:#9aaabb; --line:#2c3b4d;
  --accent:#f0705f; --accent-ink:#1a0d0b; --ok:#5ec59a; --field:#0e1620; --chip:#223144;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:20px 40px;min-height:100%}
.wrap{max-width:30rem;margin-inline:auto;display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2,h3,p{margin:0}
h1.word{font-family:var(--display);font-weight:400;font-size:2.8rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
h2{font-family:var(--display);font-weight:400;font-size:1.25rem;letter-spacing:.03em;text-wrap:balance}
.lede{color:var(--muted);max-width:34ch}
.tab{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
label{font-size:.82rem;font-weight:600;letter-spacing:.02em}
input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:12px 12px;min-height:48px}
input#code{font-family:var(--mono);font-size:1.4rem;letter-spacing:.35em;text-align:center}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;min-height:48px;padding:10px 18px;border-radius:4px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:4px 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.net{font-size:.88rem;color:var(--muted)}
.net.bad{color:var(--accent)}
.codebig{font-family:var(--mono);font-weight:500;font-size:2.6rem;letter-spacing:.3em;padding-left:.3em}
.qr{background:#fff;padding:12px;border-radius:4px;width:min(220px,100%);align-self:center;line-height:0}
.qr svg{width:100%;height:auto;display:block}
.link{font-family:var(--mono);font-size:.78rem;color:var(--muted);word-break:break-all;user-select:all}
ul.pl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.pl li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);min-height:52px}
ul.pl li:first-child{border-top:0}
.pn{min-width:0;overflow-wrap:anywhere}
.badge{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 6px;margin-left:6px;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.timer{font-family:var(--mono);font-weight:500;font-size:2.2rem;font-variant-numeric:tabular-nums}
.timer.low{color:var(--accent)}
.hold{display:block;width:100%;min-height:11rem;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:18px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative}
.hold .redact{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.hold .redact i{display:block;height:14px;background:var(--ink);border-radius:2px;opacity:.9}
.hold .redact i:nth-child(2){width:70%}
.hold .redact i:nth-child(3){width:45%}
.hold .cue{font-weight:600;margin-top:14px}
.role-loc{font-family:var(--display);font-size:1.9rem;line-height:1.1;text-wrap:balance}
.role-job{font-size:1.1rem;margin-top:8px}
.stamp{display:inline-block;font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:1.6rem;color:var(--accent);border:3px double var(--accent);padding:6px 14px;transform:rotate(-3deg);align-self:flex-start}
.stamp.ok{color:var(--ok);border-color:var(--ok)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{font:inherit;font-size:.9rem;text-align:left;background:var(--chip);color:var(--ink);border:1px solid transparent;border-radius:4px;padding:10px 10px;min-height:44px;cursor:pointer;overflow-wrap:anywhere}
.chip.struck{text-decoration:line-through;color:var(--muted);opacity:.65}
.chip.pick{border-color:var(--accent);outline:2px solid var(--accent)}
.hint{font-size:.85rem;color:var(--muted)}
.vote{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--accent);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.vote>*{max-width:30rem;width:100%;margin-inline:auto}
.vote .row .btn{flex:1}
.pad-vote{height:12rem}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dl.facts dt{color:var(--muted);font-size:.85rem}
dl.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.note{border-left:3px solid var(--accent);padding-left:10px;font-size:.92rem}
@media (prefers-reduced-motion: no-preference){
  .stamp{animation:stampin .35s ease-out both}
  @keyframes stampin{from{transform:rotate(-3deg) scale(1.5);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
}

.lbl{font-size:.82rem;font-weight:600;letter-spacing:.02em;margin-bottom:8px}
.packs{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.chip.pk{display:flex;flex-direction:column;gap:2px;padding:12px;border:2px solid var(--line)}
.chip.pk.on{border-color:var(--accent);background:var(--card)}
.chip.pk:disabled{opacity:1;cursor:default}
.chip.pk .hint{font-size:.8rem}
.top{flex-wrap:wrap}
.vote{z-index:10}
.locs{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
.locs .in{max-width:30rem;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
ul.ll{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
ul.ll li{font-size:.92rem;padding:6px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}

.hold.card{padding:0;min-height:0;aspect-ratio:3/2;overflow:hidden;border-radius:14px;background:var(--card);display:block;width:100%}
.hold.card .veil{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--ink)}
.hold.card .veil .redact{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.hold.card .veil .redact i{display:block;height:14px;background:var(--ink);border-radius:2px;opacity:.9}
.hold.card .veil .redact i:nth-child(2){width:70%}.hold.card .veil .redact i:nth-child(3){width:45%}
.hold.card .veil .cue{font-weight:600;margin-top:auto}
.hold.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.bn{position:absolute;display:flex;align-items:center;gap:8px;background:rgba(14,24,39,.88);color:#fff;font-style:italic;font-weight:600;font-size:clamp(.95rem,4.2vw,1.2rem);line-height:1.2;padding:6px 14px 8px 10px;max-width:calc(100% - 12px);border-bottom:2px solid var(--bn-line,#e0a867)}
.bn svg{width:14px;height:18px;flex:none}
.bn span{overflow-wrap:anywhere;min-width:0}
.bn.top{left:10px;top:10px;border-radius:3px}
.bn.bot{left:0;bottom:10px;border-radius:0 3px 3px 0;padding-left:12px}
.hold.card.spy{--bn-line:#c4372c}
.endimg{border-radius:14px;overflow:hidden;aspect-ratio:3/2;border:2px solid var(--ink)}
.endimg img{display:block;width:100%;height:100%;object-fit:cover}
.ll.pics{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
ul.ll.pics li{border:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.ll.pics img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--chip)}
.stamp.none{color:var(--muted);border-color:var(--muted)}
details.sheet summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
details.sheet[open] summary{margin-bottom:6px}
.playbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.playbar .btn{flex:1}
.timer.small{font-size:1.5rem;min-width:4.2ch;text-align:right}
button.pic{font:inherit;color:var(--ink);background:transparent;border:2px solid transparent;border-radius:10px;padding:4px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;width:100%}
button.pic.pick{border-color:var(--accent)}
button.pic.struck img{opacity:.3;filter:grayscale(1)}
button.pic.struck span{text-decoration:line-through;color:var(--muted)}
li.pic{display:flex;flex-direction:column;gap:4px}
.locbar{position:sticky;bottom:0;display:flex;flex-direction:column;gap:8px;padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.locbar .row .btn{flex:1}
.locs{padding-bottom:0}
.locs .in::after{content:"";display:block;height:calc(28px + env(safe-area-inset-bottom,0px));flex:none}
.locbar{z-index:2}
</style>

</head>

  if(h.ph==='play' || h.ph==='vote'){
    if(h.ends && Date.now()>=h.ends){ endGame({w:'none', why:'time'}); return; }
    var spyId = null; for(var k in h.a) if(h.a[k]===-1) spyId=k;
    if(spyId && !ps.some(function(p){return p.id===spyId;})){ if(!spyGoneAt) spyGoneAt=Date.now(); if(Date.now()-spyGoneAt>30000){ spyGoneAt=0; endGame({w:'crew', why:'spyleft'}); return; } } else { spyGoneAt=0; }
    for(var i=0;i<ps.length;i++){
      var p=ps[i], g=p.pr.gs;
      if(g && typeof g==='object' && g.r===h.r && typeof g.i==='number' && h.a[p.id]===-1){
        endGame({w: g.i===h.loc?'spy':'crew', why: g.i===h.loc?'guess':'badguess', gs:g.i}); return;
      }
    }
  }
}
function startGame(){

  var li; do{ li=act[rand(act.length)]; }while(li===lastLoc && act.length>1);
  lastLoc = li;
  var spy = pl[rand(pl.length)].id, a = {}, roles = [0,1,2,3,4,5,6];
  for(var z=roles.length-1;z>0;z--){ var y=rand(z+1), tmp=roles[z]; roles[z]=roles[y]; roles[y]=tmp; }
  pl.forEach(function(p){ a[p.id] = p.id===spy ? -1 : roles.pop(); });
  var dur = hState.dur || 0;
  revealed=false; guessing=false; guessPick=null; struck={};
  setH({ph:'play', r:(hState.r||0)+1, loc:li, a:a, dur:dur, start:Date.now(), ends:dur ? Date.now()+dur*1000 : 0, acc:null, res:null, note:null});
}

  }

  if(!c){ homeMsgInline('Koodia ei saatu. Yritä uudelleen.'); return; }

  keepAwake(); homeMsg=''; lastHtml=''; onChange();

/* ---------- Peer-to-peer-huone (PeerJS / WebRTC) ---------- */
// Isäntä on "palvelin": hänen puhelimensa pitää pelin tilan ja lähettää sen kaikille.
// Liittyjät yhdistävät isännän peer-tunnukseen spyfall-<koodi>. Välityspalvelinta tarvitaan vain yhteyden avaamiseen.
function makeRoom(){
  var myId = Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);
  var mine = {}, cur = null, role = null, peer = null, conns = {}, hconn = null;
  var players = {}, cache = [], hs = [], errs = [], leaving = false, retryT = null, lostAt = 0;
  var ALLOWED = {n:1, ac:1, v:1, gs:1};
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function parse(d){ try{ return typeof d==='string' ? JSON.parse(d) : null; }catch(e){ return null; } }
  function clean(patch){
    var o = {};
    if(typeof patch.n==='string') o.n = patch.n.slice(0,14);
    if(patch.v===null || typeof patch.v==='string') o.v = patch.v===null ? null : patch.v.slice(0,12);
    if(patch.ac===null || (patch.ac && typeof patch.ac.t==='string' && typeof patch.ac.r==='number')) o.ac = patch.ac===null ? null : {t:patch.ac.t.slice(0,20), r:patch.ac.r};
    if(patch.gs===null || (patch.gs && typeof patch.gs.r==='number' && typeof patch.gs.i==='number')) o.gs = patch.gs===null ? null : {r:patch.gs.r, i:patch.gs.i};
    return o;
  }
  function merge(base, patch){ var np = Object.assign({}, base); Object.keys(patch).forEach(function(k){ if(patch[k]===null) delete np[k]; else np[k]=patch[k]; }); return np; }
  function build(){
    var arr = [], t = Date.now();
    Object.keys(players).forEach(function(id){
      var pr = players[id]; if(!pr || typeof pr!=='object') return;
      var p = Object.assign({}, pr); p.g = cur;
      arr.push({peer:id, by:null, isMe:id===myId, sameTab:id===myId, kind:'viewer', guest:false, presence:p, updatedAt:t});
    });
    return arr;
  }
  function notify(){ cache = build(); var ch = {peers:cache, joined:[], left:[], updated:[]}; hs.slice().forEach(function(h){ try{ h(ch); }catch(e){ console.error(e); } }); }
  function fail(e){ errs.slice().forEach(function(f){ try{ f(e); }catch(x){} }); }
  function reset(){
    leaving = true;
    clearTimeout(retryT); retryT = null;
    Object.keys(conns).forEach(function(k){ try{ conns[k].close(); }catch(e){} });
    if(hconn){ try{ hconn.close(); }catch(e){} }
    if(peer){ try{ peer.destroy(); }catch(e){} }
    conns = {}; hconn = null; peer = null; players = {}; cache = []; cur = null; role = null; mine = {}; lostAt = 0;
    leaving = false;
  }
  function broadcast(){
    var msg = JSON.stringify({t:'s', p:players});
    Object.keys(conns).forEach(function(id){ try{ conns[id].send(msg); }catch(e){} });
  }
  function hostChanged(){ broadcast(); notify(); }

  function wireHost(p){
    p.on('connection', function(c){
      var pid = null;
      c.on('data', function(d){
        var m = parse(d); if(!m) return;
        if(m.t==='j' && typeof m.id==='string' && /^[a-z0-9]{6,24}$/.test(m.id)){
          if(!players[m.id] && Object.keys(players).length>=12){ try{ c.send(JSON.stringify({t:'full'})); }catch(e){} setTimeout(function(){ try{ c.close(); }catch(e){} },300); return; }
          if(conns[m.id] && conns[m.id]!==c){ var old = conns[m.id]; delete conns[m.id]; try{ old.close(); }catch(e){} }
          pid = m.id; conns[pid] = c;
          players[pid] = merge({}, clean(m.p||{}));
          hostChanged();
        } else if(m.t==='p' && pid && players[pid]){
          players[pid] = merge(players[pid], clean(m.patch||{}));
          hostChanged();
        }
      });
      var gone = function(){ if(pid && conns[pid]===c){ delete conns[pid]; delete players[pid]; hostChanged(); } };
      c.on('close', gone); c.on('error', gone);
    });
    p.on('disconnected', function(){ if(!leaving){ try{ p.reconnect(); }catch(e){} } });
    p.on('error', function(e){ if(e && (e.type==='network' || e.type==='server-error' || e.type==='socket-error')) return; console.error(e); });
  }

  function connectHost(done){
    if(!peer || peer.destroyed){ peer = new Peer({debug:0}); peer.on('error', onPeerErr); }
    var go = function(){
      var c = peer.connect('spyfall-'+cur, {reliable:true}); var opened = false;
      c.on('open', function(){
        opened = true; hconn = c; lostAt = 0;
        c.send(JSON.stringify({t:'j', id:myId, p:clone(mine)}));
        if(done){ var d = done; done = null; d(null); }
      });
      c.on('data', function(d){
        var m = parse(d); if(!m) return;
        if(m.t==='s'){ players = m.p || {}; notify(); }
        else if(m.t==='full'){ if(done){ var f = done; done = null; f({type:'full'}); } }
        else if(m.t==='bye'){ leaving = true; fail({bye:true}); }
      });
      var lost = function(){ if(hconn===c){ hconn = null; hostLost(); } };
      c.on('close', lost); c.on('error', lost);
      c._failOpen = function(e){ if(!opened && done){ var f = done; done = null; f(e); } };
      peer._cc = c;
    };
    if(peer.open) go(); else peer.once('open', go);
  }
  function onPeerErr(e){
    if(e && e.type==='peer-unavailable'){
      if(peer && peer._cc && peer._cc._failOpen) peer._cc._failOpen(e);
      return;
    }
    if(peer && peer._cc && peer._cc._failOpen && !hconn) peer._cc._failOpen(e);
  }
  function hostLost(){
    if(leaving || !cur || role!=='join') return;
    if(!lostAt) lostAt = Date.now();
    var attempt = function(){
      clearTimeout(retryT);
      if(leaving || !cur || hconn) return;
      if(Date.now()-lostAt > 15000){ fail({lost:true}); return; }
      try{ if(peer && peer.disconnected && !peer.destroyed) peer.reconnect(); }catch(e){}
      connectHost(null);
      retryT = setTimeout(attempt, 2500);
    };
    retryT = setTimeout(attempt, 800);
  }

  return {
    peers: function(){ return cache; },
    onPeers: function(h, err){
      hs.push(h); if(err) errs.push(err);
      setTimeout(function(){ try{ h({peers:cache, joined:[], left:[], updated:[]}); }catch(e){} }, 0);
      return function(){ hs = hs.filter(function(x){ return x!==h; }); };
    },
    host: function(code, init){
      reset();
      return new Promise(function(res, rej){
        var finished = false, p = new Peer('spyfall-'+code, {debug:0});
        var bail = function(e){ if(finished) return; finished = true; try{ p.destroy(); }catch(x){} rej(e); };
        var to = setTimeout(function(){ bail({type:'timeout'}); }, 12000);
        p.on('error', function(e){ clearTimeout(to); bail(e); });
        p.on('open', function(){
          if(finished) return; finished = true; clearTimeout(to);
          peer = p; role = 'host'; cur = code; mine = merge({}, init); mine = JSON.parse(JSON.stringify(mine));
          players = {}; players[myId] = mine; wireHost(p); notify(); res();
        });
      });
    },
    join: function(code, init){
      reset();
      return new Promise(function(res, rej){
        cur = code; role = 'join'; mine = clone(init); var finished = false;
        var bail = function(e){ if(finished) return; finished = true; var pp = peer; reset(); rej(e); };
        var to = setTimeout(function(){ bail({type:'timeout'}); }, 12000);
        connectHost(function(err){ clearTimeout(to); if(err) bail(err); else { finished = true; res(); } });
      });
    },
    presence: function(patch){
      if(role==='host'){ mine = merge(mine, JSON.parse(JSON.stringify(patch))); players[myId] = mine; hostChanged(); }
      else if(role==='join'){
        var cl = clean(patch); mine = merge(mine, cl);
        if(hconn && hconn.open){ try{ hconn.send(JSON.stringify({t:'p', patch:cl})); }catch(e){} }
      }
      return Promise.resolve();
    },
    leave: function(){
      if(role==='host'){ var bye = JSON.stringify({t:'bye'}); Object.keys(conns).forEach(function(k){ try{ conns[k].send(bye); }catch(e){} }); setTimeout(reset, 250); }
      else reset();
    },
    wake: function(){ try{ if(peer && peer.disconnected && !peer.destroyed) peer.reconnect(); }catch(e){} }
  };
}

/* ---------- start ---------- */
showHome();
(function(){
  try{ if(typeof Peer==='undefined') throw new Error('PeerJS puuttuu'); room = makeRoom(); }catch(e){ console.error(e); room = null; }
  roomChecked = true;
  if(room) room.onPeers(onChange, function(e){ if(code) leaveGame(e && e.bye ? 'Isäntä lopetti pelin.' : 'Yhteys isäntään katkesi.'); });
  updateNet();
})();
})();
</script>
